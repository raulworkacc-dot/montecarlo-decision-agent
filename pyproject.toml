[project]
name = "montecarlo-decision-agent"
version = "1.0.0"
description = "Decision intelligence case study: ML counterfactuals, Monte Carlo risk simulation and a Claude tool-using agent, built inside an evaluated agentic harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Raul Cañadas" }]
requires-python = ">=3.11"
keywords = ["monte-carlo", "decision-intelligence", "uplift", "counterfactual", "claude", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "anthropic>=1.0",
    "joblib>=1.4",
    "numpy>=2.2",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "scikit-learn>=1.6",
]

[project.scripts]
mcd = "montecarlo_decisions.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/montecarlo_decisions", "src/harness"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.15",
]
notebook = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: end-to-end tests that run the full pipeline (deselect with -m 'not slow')"]

[tool.coverage.run]
source = ["montecarlo_decisions", "harness"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PTH", "RUF", "PT"]
