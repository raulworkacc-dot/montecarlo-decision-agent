name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just check (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v3
      - name: Install
        run: just setup --locked
      - name: Lint and test
        run: just check

  pipeline:
    name: Pipeline smoke run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Full pipeline (all validation gates must pass)
        run: uv run mcd pipeline --simulations 10000
      - name: Static dashboard
        run: uv run mcd dashboard --output site
      - uses: extractions/setup-just@v3
      - name: Coverage
        run: just coverage
      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-results
          path: |
            artifacts/report.md
            artifacts/data/decision_summary.csv
            artifacts/data/validation_checks.json
            site/
            coverage.xml
